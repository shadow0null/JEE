services:
  - type: web
    name: studydesk-jee-engine
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: JEE_CORS_ORIGINS
        value: https://studydesk.fun
      - key: JEE_REQUIRE_API_KEY
        value: "0"
